/* werkende versie, fonetisch en zoekveld, stopknop om zoeken te stoppen */
<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MTG Voice Card</title>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
}

button{
    font-size:22px;
    padding:16px 24px;
    border-radius:15px;
    border:none;
    background:white;
    color:black;
    margin:5px;
}

button:disabled{
    opacity:.5;
}

#stopButton{
    background:#d33;
    color:white;
}

#result{
    margin-top:20px;
    font-size:20px;
    max-width:90%;
    white-space:pre-line;
    min-height:70px;
}

#card{
    display:none;
    max-width:90%;
    max-height:65vh;
    margin-top:20px;
    border-radius:12px;
}

#manual{
    width:90%;
    max-width:500px;
    margin-top:30px;
}

#manualInput{
    box-sizing:border-box;
    width:100%;
    font-size:20px;
    padding:14px;
    border-radius:10px;
    border:none;
    text-align:center;
}

#manualButton{
    margin-top:10px;
}
</style>

</head>

<body>

<div>
    <button id="listenButton">🎤 Speak card name</button>
    <button id="stopButton" disabled>⏹ Stop</button>
</div>

<div id="result">
    Tap the button and say a Magic card name.
</div>

<img id="card" alt="Magic card">

<div id="manual">

```
<input
    id="manualInput"
    type="text"
    placeholder="Type difficult card name..."
    autocomplete="off"
    autocorrect="off"
    autocapitalize="off"
    spellcheck="false"
>

<button id="manualButton">
    🔎 Search card
</button>
```

</div>

<script>

const button =
    document.getElementById("listenButton");

const stopButton =
    document.getElementById("stopButton");

const result =
    document.getElementById("result");

const cardImage =
    document.getElementById("card");

const manualInput =
    document.getElementById("manualInput");

const manualButton =
    document.getElementById("manualButton");


let lastHeardText = "";
let cardNamesCache = null;
let recognition = null;
let timeout = null;
let searchCancelled = false;
let isSearching = false;


/* =========================================================
   SPEECH RECOGNITION
========================================================= */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if(!SpeechRecognition){

    result.textContent =
        "Speech recognition is not supported.";

}
else{

    recognition =
        new SpeechRecognition();

    recognition.lang =
        "en-US";

    recognition.continuous =
        false;

    recognition.interimResults =
        false;

    recognition.maxAlternatives =
        5;


    /* START */

    button.addEventListener(
        "click",
        startListening
    );


    /* STOP SEARCH */

    stopButton.addEventListener(
        "click",
        stopSearch
    );


    /* RESULT */

    recognition.onresult =
        async function(event){

            clearTimeout(timeout);

            const candidates = [];

            for(
                let i=0;
                i<event.results[0].length;
                i++
            ){

                const transcript =
                    event.results[0][i]
                    .transcript
                    .trim();

                if(transcript){

                    candidates.push(
                        transcript
                    );
                }
            }


            if(candidates.length){

                lastHeardText =
                    candidates[0];

            }


            result.textContent =
                "Heard: " +
                lastHeardText +
                "\nSearching...";


            try{
                recognition.stop();
            }
            catch(e){}


            /*
               Inspreken is klaar.
               Nu begint de zoekfase.
               De stopknop wordt daarom actief.
            */

            button.disabled = false;

            isSearching = true;
            stopButton.disabled = false;

            searchCancelled = false;


            await findBestCard(
                candidates
            );

        };


    /* ERROR */

    recognition.onerror =
        function(event){

            clearTimeout(timeout);

            button.disabled = false;

            if(!isSearching){

                stopButton.disabled = true;

            }

            if(event.error !== "aborted"){

                result.textContent =
                    "Speech error: " +
                    event.error;

            }

        };


    /* END */

    recognition.onend =
        function(){

            clearTimeout(timeout);

            button.disabled = false;

            /*
               Tijdens het zoeken moet de stopknop
               actief blijven. De recognition is namelijk
               al klaar, maar de zoekactie loopt nog.
            */

            if(!isSearching){

                stopButton.disabled = true;

            }

        };

}


/* =========================================================
   START LISTENING
========================================================= */

function startListening(){

    if(!recognition){
        return;
    }

    clearTimeout(timeout);

    searchCancelled = true;
    isSearching = false;

    lastHeardText = "";

    cardImage.style.display =
        "none";

    result.textContent =
        "🎤 Listening...";

    button.disabled = true;

    /*
       Tijdens de maximaal 3 seconden inspreken
       is Stop niet nodig.
    */

    stopButton.disabled = true;

    searchCancelled = false;

    try{

        recognition.start();

    }
    catch(error){

        console.log(error);

        button.disabled = false;
        stopButton.disabled = true;

    }


    timeout =
        setTimeout(
            function(){

                try{
                    recognition.stop();
                }
                catch(e){}

            },
            3000
        );
}


/* =========================================================
   STOP SEARCH
========================================================= */

function stopSearch(){

    clearTimeout(timeout);

    /*
       Dit stopt de zoekactie.
       De speech recognition hoeft hier niet meer
       gestopt te worden, want het inspreken is al klaar.
    */

    searchCancelled = true;
    isSearching = false;

    stopButton.disabled = true;
    button.disabled = false;

    result.textContent =
        "⏹ Search stopped.";

}


/* =========================================================
   NORMALIZE
========================================================= */

function normalizeText(text){

    return text
        .toLowerCase()
        .replace(/['’]/g,"")
        .replace(/[^a-z0-9\s]/g," ")
        .replace(/\s+/g," ")
        .trim();

}


/* =========================================================
   LEVENSHTEIN
========================================================= */

function levenshtein(a,b){

    const matrix=[];

    for(let i=0;i<=b.length;i++){
        matrix[i]=[i];
    }

    for(let j=0;j<=a.length;j++){
        matrix[0][j]=j;
    }

    for(let i=1;i<=b.length;i++){

        for(let j=1;j<=a.length;j++){

            if(
                b.charAt(i-1) ===
                a.charAt(j-1)
            ){

                matrix[i][j] =
                    matrix[i-1][j-1];

            }
            else{

                matrix[i][j] =
                    Math.min(
                        matrix[i-1][j]+1,
                        matrix[i][j-1]+1,
                        matrix[i-1][j-1]+1
                    );

            }
        }
    }

    return matrix[b.length][a.length];
}


/* =========================================================
   SIMILARITY
========================================================= */

function similarity(a,b){

    a = normalizeText(a);
    b = normalizeText(b);

    if(!a || !b){
        return 0;
    }

    if(a === b){
        return 1;
    }

    const distance =
        levenshtein(a,b);

    const longest =
        Math.max(a.length,b.length);

    return 1 -
        distance / longest;
}


/* =========================================================
   CARD NAMES
========================================================= */

async function getCardNames(){

    if(cardNamesCache){
        return cardNamesCache;
    }

    try{

        const response =
            await fetch(
                "https://api.scryfall.com/catalog/card-names"
            );

        if(!response.ok){
            return null;
        }

        const data =
            await response.json();

        cardNamesCache =
            data.data;

        return cardNamesCache;

    }
    catch(error){

        console.error(error);

        return null;
    }
}


/* =========================================================
   LOCAL FUZZY
========================================================= */

async function findClosestCard(spoken){

    const cardNames =
        await getCardNames();

    if(!cardNames){
        return null;
    }

    let bestName = null;
    let bestScore = 0;

    for(
        const cardName of cardNames
    ){

        if(searchCancelled){
            return null;
        }

        const score =
            similarity(
                spoken,
                cardName
            );

        if(score > bestScore){

            bestScore = score;
            bestName = cardName;

        }
    }

    if(bestScore >= 0.82){

        return {
            name:bestName,
            score:bestScore
        };

    }

    return null;
}


/* =========================================================
   PHONETIC NORMALIZATION
========================================================= */

function phoneticNormalize(text){

    let s =
        normalizeText(text);

    s =
        s
        .replace(/ph/g,"f")
        .replace(/th/g,"t")
        .replace(/wh/g,"w")
        .replace(/ck/g,"k")
        .replace(/qu/g,"kw")
        .replace(/c(?=[eiy])/g,"s")
        .replace(/c/g,"k")
        .replace(/q/g,"k")
        .replace(/x/g,"ks")
        .replace(/z/g,"s")
        .replace(/j/g,"y")
        .replace(/ae/g,"a")
        .replace(/oe/g,"o")
        .replace(/ee/g,"i")
        .replace(/oo/g,"u")
        .replace(/ou/g,"u");

    s =
        s.replace(
            /(.)\1+/g,
            "$1"
        );

    return s;
}


/* =========================================================
   PHONETIC SCORE
========================================================= */

function phoneticSimilarity(a,b){

    return similarity(
        phoneticNormalize(a),
        phoneticNormalize(b)
    );
}


/* =========================================================
   PHONETIC SEARCH
========================================================= */

async function findPhoneticCard(
    candidates
){

    const cardNames =
        await getCardNames();

    if(!cardNames){
        return null;
    }

    let bestName = null;
    let bestScore = 0;

    for(
        const candidate of candidates
    ){

        for(
            const cardName of cardNames
        ){

            if(searchCancelled){
                return null;
            }

            const score =
                phoneticSimilarity(
                    candidate,
                    cardName
                );

            if(score > bestScore){

                bestScore = score;
                bestName = cardName;

            }
        }
    }

    console.log(
        "Phonetic:",
        bestName,
        bestScore
    );

    if(bestScore >= 0.78){

        return {
            name:bestName,
            score:bestScore
        };

    }

    return null;
}


/* =========================================================
   MAIN SEARCH
========================================================= */

async function findBestCard(
    candidates
){

    searchCancelled = false;
    isSearching = true;

    stopButton.disabled = false;


    /* -----------------------------------------------------
       1. EXACT
    ----------------------------------------------------- */

    for(
        const candidate of candidates
    ){

        if(searchCancelled){
            return;
        }

        try{

            const response =
                await fetch(
                    "https://api.scryfall.com/cards/named?exact=" +
                    encodeURIComponent(candidate)
                );

            if(searchCancelled){
                return;
            }

            if(response.ok){

                const data =
                    await response.json();

                showCard(
                    data,
                    data.name,
                    "Exact Match"
                );

                isSearching = false;
                stopButton.disabled = true;

                return;
            }

        }
        catch(error){

            console.error(error);

        }
    }


    /* -----------------------------------------------------
       2. SCRYFALL FUZZY
    ----------------------------------------------------- */

    for(
        const candidate of candidates
    ){

        if(searchCancelled){
            return;
        }

        try{

            const response =
                await fetch(
                    "https://api.scryfall.com/cards/named?fuzzy=" +
                    encodeURIComponent(candidate)
                );

            if(searchCancelled){
                return;
            }

            if(response.ok){

                const data =
                    await response.json();

                showCard(
                    data,
                    data.name,
                    "Scryfall Fuzzy"
                );

                isSearching = false;
                stopButton.disabled = true;

                return;
            }

        }
        catch(error){

            console.error(error);

        }
    }


    /* -----------------------------------------------------
       3. LOCAL FUZZY
    ----------------------------------------------------- */

    result.textContent =
        "Heard: " +
        lastHeardText +
        "\nTrying Local Fuzzy...";


    let bestMatch = null;
    let bestScore = 0;


    for(
        const candidate of candidates
    ){

        const match =
            await findClosestCard(
                candidate
            );

        if(searchCancelled){
            return;
        }

        if(
            match &&
            match.score > bestScore
        ){

            bestMatch = match;
            bestScore = match.score;

        }
    }


    if(bestMatch){

        try{

            const response =
                await fetch(
                    "https://api.scryfall.com/cards/named?exact=" +
                    encodeURIComponent(
                        bestMatch.name
                    )
                );

            if(searchCancelled){
                return;
            }

            if(response.ok){

                const data =
                    await response.json();

                showCard(
                    data,
                    bestMatch.name,
                    "Local Fuzzy"
                );

                isSearching = false;
                stopButton.disabled = true;

                return;
            }

        }
        catch(error){

            console.error(error);

        }

    }


    /* -----------------------------------------------------
       4. PHONETIC
    ----------------------------------------------------- */

    result.textContent =
        "Heard: " +
        lastHeardText +
        "\nTrying Phonetic Match...";


    const phonetic =
        await findPhoneticCard(
            candidates
        );


    if(searchCancelled){
        return;
    }


    if(phonetic){

        try{

            const response =
                await fetch(
                    "https://api.scryfall.com/cards/named?exact=" +
                    encodeURIComponent(
                        phonetic.name
                    )
                );

            if(searchCancelled){
                return;
            }

            if(response.ok){

                const data =
                    await response.json();

                showCard(
                    data,
                    phonetic.name,
                    "Phonetic Match"
                );

                isSearching = false;
                stopButton.disabled = true;

                return;
            }

        }
        catch(error){

            console.error(error);

        }
    }


    if(!searchCancelled){

        result.textContent =
            "Heard: " +
            lastHeardText +
            "\nCard not found.";

        isSearching = false;
        stopButton.disabled = true;

    }

}


/* =========================================================
   SHOW CARD
========================================================= */

function showCard(
    data,
    matchedName,
    method
){

    if(searchCancelled){
        return;
    }

    result.textContent =
        "Heard: " +
        lastHeardText +
        "\nFound by: " +
        method +
        "\nMatched: " +
        matchedName;


    let imageURL = null;


    if(
        data.image_uris &&
        data.image_uris.normal
    ){

        imageURL =
            data.image_uris.normal;

    }
    else if(
        data.card_faces &&
        data.card_faces[0] &&
        data.card_faces[0].image_uris
    ){

        imageURL =
            data.card_faces[0]
            .image_uris
            .normal;

    }


    if(imageURL){

        cardImage.src =
            imageURL;

        cardImage.style.display =
            "block";

    }


    button.disabled = false;

}


/* =========================================================
   MANUAL SEARCH
========================================================= */

manualButton.addEventListener(
    "click",
    manualSearch
);


manualInput.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            manualSearch();

        }

    }
);


function manualSearch(){

    const text =
        manualInput.value.trim();

    if(!text){

        return;

    }


    /*
       Cancel any current voice/search operation.
    */

    searchCancelled = true;
    isSearching = false;

    try{

        recognition.abort();

    }
    catch(e){}


    lastHeardText = "";


    cardImage.style.display =
        "none";


    result.textContent =
        "Typed: " +
        text +
        "\nSearching...";


    searchCancelled = false;
    isSearching = true;

    stopButton.disabled = false;


    findBestCard(
        [text]
    );

}

</script>

</body>
</html>
