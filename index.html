/* =========================================================
   SPEECH RECOGNITION

const SpeechRecognition =

   STOP SEARCH

function stopSearch(){

    searchCancelled = true;

    isSearching = false;

/* =========================================================
   NORMALIZE
========================================================= */

function normalizeText(text){

    return text
        .toLowerCase()
        .replace(/['’]/g,"")
        .replace(/[^a-z0-9\s]/g," ")
        .replace(/\s+/g," ")
        .trim();

}


/* =========================================================
   LEVENSHTEIN
========================================================= */

function levenshtein(a,b){

    const matrix=[];


    for(let i=0;i<=b.length;i++){

        matrix[i]=[i];

    }


    for(let j=0;j<=a.length;j++){

        matrix[0][j]=j;

    }


    for(let i=1;i<=b.length;i++){

        for(let j=1;j<=a.length;j++){

            if(
                b.charAt(i-1) ===
                a.charAt(j-1)
            ){

                matrix[i][j] =
                    matrix[i-1][j-1];

            }
            else{

                matrix[i][j] =
                    Math.min(
                        matrix[i-1][j]+1,
                        matrix[i][j-1]+1,
                        matrix[i-1][j-1]+1
                    );

            }

        }

    }


    return matrix[b.length][a.length];

}


/* =========================================================
   SIMILARITY
========================================================= */

function similarity(a,b){

    a = normalizeText(a);

    b = normalizeText(b);


    if(!a || !b){

        return 0;

    }


    if(a === b){

        return 1;

    }


    const distance =
        levenshtein(a,b);


    const longest =
        Math.max(
            a.length,
            b.length
        );


    return 1 -
        distance / longest;

}


/* =========================================================
   CARD NAMES
========================================================= */

async function getCardNames(){

    if(cardNamesCache){

        return cardNamesCache;

    }


    try{

        const response =
            await fetch(
                "https://api.scryfall.com/catalog/card-names"
            );


        if(!response.ok){

            return null;

        }


        const data =
            await response.json();


        cardNamesCache =
            data.data;


        return cardNamesCache;

    }
    catch(error){

        console.error(error);

        return null;

    }

}


/* =========================================================
   GET ENGLISH CARD
========================================================= */

async function getEnglishCard(
    cardName
){

    if(searchCancelled){

        return null;

    }


    try{

        const query =
            '!"' +
            cardName +
            '" lang:en';


        const response =
            await fetch(
                "https://api.scryfall.com/cards/search?q=" +
                encodeURIComponent(query)
            );


        if(searchCancelled){

            return null;

        }


        if(!response.ok){

            return null;

        }


        const data =
            await response.json();


        if(
            data.data &&
            data.data.length
        ){

            for(
                const card of data.data
            ){

                if(
                    card.lang === "en" &&
                    card.name.toLowerCase() ===
                    cardName.toLowerCase()
                ){

                    return card;

                }

            }

        }

    }
    catch(error){

        console.error(error);

    }


    return null;

}


/* =========================================================
   LOCAL FUZZY
========================================================= */

async function findClosestCard(
    spoken
){

    const cardNames =
        await getCardNames();


    if(!cardNames){

        return null;

    }


    let bestName = null;

    let bestScore = 0;


    for(
        const cardName of cardNames
    ){

        if(searchCancelled){

            return null;

        }


        const score =
            similarity(
                spoken,
                cardName
            );


        if(score > bestScore){

            bestScore = score;

            bestName = cardName;

        }

    }


    if(bestScore >= 0.82){

        return {

            name:bestName,

            score:bestScore

        };

    }


    return null;

}


/* =========================================================
   PHONETIC NORMALIZATION
========================================================= */

function phoneticNormalize(text){

    let s =
        normalizeText(text);


    s =
        s
        .replace(/ph/g,"f")
        .replace(/th/g,"t")
        .replace(/wh/g,"w")
        .replace(/ck/g,"k")
        .replace(/qu/g,"kw")
        .replace(/c(?=[eiy])/g,"s")
        .replace(/c/g,"k")
        .replace(/q/g,"k")
        .replace(/x/g,"ks")
        .replace(/z/g,"s")
        .replace(/j/g,"y")
        .replace(/ae/g,"a")
        .replace(/oe/g,"o")
        .replace(/ee/g,"i")
        .replace(/oo/g,"u")
        .replace(/ou/g,"u");


    s =
        s.replace(
            /(.)\1+/g,
            "$1"
        );


    return s;

}


/* =========================================================
   PHONETIC SCORE
========================================================= */

function phoneticSimilarity(a,b){

    return similarity(
        phoneticNormalize(a),
        phoneticNormalize(b)
    );

}


/* =========================================================
   PHONETIC SEARCH
========================================================= */

async function findPhoneticCard(
    candidates
){

    const cardNames =
        await getCardNames();


    if(!cardNames){

        return null;

    }


    let bestName = null;

    let bestScore = 0;


    for(
        const candidate of candidates
    ){

        for(
            const cardName of cardNames
        ){

            if(searchCancelled){

                return null;

            }


            const score =
                phoneticSimilarity(
                    candidate,
                    cardName
                );


            if(score > bestScore){

                bestScore = score;

                bestName = cardName;

            }

        }

    }


    console.log(
        "Phonetic:",
        bestName,
        bestScore
    );


    if(bestScore >= 0.78){

        return {

            name:bestName,

            score:bestScore

        };

    }


    return null;

}


/* =========================================================
   MAIN CARD SEARCH
========================================================= */

async function findBestCard(
    candidates
){

    searchCancelled = false;

    isSearching = true;

    stopButton.disabled = false;


    /* -----------------------------------------------------
       1. EXACT
    ----------------------------------------------------- */

    for(
        const candidate of candidates
    ){

        if(searchCancelled){

            return;

        }


        try{

            const response =
                await fetch(
                    "https://api.scryfall.com/cards/named?exact=" +
                    encodeURIComponent(candidate)
                );


            if(searchCancelled){

                return;

            }


            if(response.ok){

                const data =
                    await response.json();


                const englishCard =
                    await getEnglishCard(
                        data.name
                    );


                if(searchCancelled){

                    return;

                }


                if(englishCard){

                    showCard(
                        englishCard,
                        englishCard.name,
                        "Exact Match"
                    );


                    isSearching = false;

                    stopButton.disabled = true;

                    return;

                }

            }

        }
        catch(error){

            console.error(error);

        }

    }


    /* -----------------------------------------------------
       2. SCRYFALL FUZZY
    ----------------------------------------------------- */

    for(
        const candidate of candidates
    ){

        if(searchCancelled){

            return;

        }


        try{

            const response =
                await fetch(
                    "https://api.scryfall.com/cards/named?fuzzy=" +
                    encodeURIComponent(candidate)
                );


            if(searchCancelled){

                return;

            }


            if(response.ok){

                const data =
                    await response.json();


                const englishCard =
                    await getEnglishCard(
                        data.name
                    );


                if(searchCancelled){

                    return;

                }


                if(englishCard){

                    showCard(
                        englishCard,
                        englishCard.name,
                        "Scryfall Fuzzy"
                    );


                    isSearching = false;

                    stopButton.disabled = true;

                    return;

                }

            }

        }
        catch(error){

            console.error(error);

        }

    }


    /* -----------------------------------------------------
       3. LOCAL FUZZY
    ----------------------------------------------------- */

    result.textContent =
        "Heard: " +
        lastHeardText +
        "\nTrying Local Fuzzy...";


    let bestMatch = null;

    let bestScore = 0;


    for(
        const candidate of candidates
    ){

        const match =
            await findClosestCard(
                candidate
            );


        if(searchCancelled){

            return;

        }


        if(
            match &&
            match.score > bestScore
        ){

            bestMatch = match;

            bestScore = match.score;

        }

    }


    if(bestMatch){

        const englishCard =
            await getEnglishCard(
                bestMatch.name
            );


        if(searchCancelled){

            return;

        }


        if(englishCard){

            showCard(
                englishCard,
                englishCard.name,
                "Local Fuzzy"
            );


            isSearching = false;

            stopButton.disabled = true;

            return;

        }

    }


    /* -----------------------------------------------------
       4. PHONETIC
    ----------------------------------------------------- */

    result.textContent =
        "Heard: " +
        lastHeardText +
        "\nTrying Phonetic Match...";


    const phonetic =
        await findPhoneticCard(
            candidates
        );


    if(searchCancelled){

        return;

    }


    if(phonetic){

        const englishCard =
            await getEnglishCard(
                phonetic.name
            );


        if(searchCancelled){

            return;

        }


        if(englishCard){

            showCard(
                englishCard,
                englishCard.name,
                "Phonetic Match"
            );


            isSearching = false;

            stopButton.disabled = true;

            return;

        }

    }


    if(!searchCancelled){

        result.textContent =
            "Heard: " +
            lastHeardText +
            "\nCard not found.";


        isSearching = false;

        stopButton.disabled = true;

    }

}


/* =========================================================
   SHOW CARD
========================================================= */

function showCard(
    data,
    matchedName,
    method
){

    if(searchCancelled){

        return;

    }


    if(data.lang !== "en"){

        console.error(
            "Non-English card rejected:",
            data.lang,
            data.name
        );

        return;

    }


    let imageURL = null;


    if(
        data.image_uris &&
        data.image_uris.normal
    ){

        imageURL =
            data.image_uris.normal;

    }
    else if(
        data.card_faces &&
        data.card_faces[0] &&
        data.card_faces[0].image_uris
    ){

        imageURL =
            data.card_faces[0]
            .image_uris
            .normal;

    }


    if(!imageURL){

        result.textContent =
            "Card found, but no image is available.";

        return;

    }


    fullscreenCard.src =
        imageURL;


    cardView.style.display =
        "flex";


    document.body.classList.add(
        "cardMode"
    );

}


/* =========================================================
   CLOSE CARD VIEW
========================================================= */

function closeCardView(){

    cardView.style.display =
        "none";


    document.body.classList.remove(
        "cardMode"
    );


    fullscreenCard.removeAttribute(
        "src"
    );

}


/* =========================================================
   TAP CARD TO RETURN
========================================================= */

cardView.addEventListener(
    "click",
    function(){

        closeCardView();

    }
);

   MANUAL CARD SEARCH
========================================================= */

manualButton.addEventListener(
    "click",
    manualSearch
);


manualInput.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            manualSearch();

        }

    }
);


function manualSearch(){

    const text =
        manualInput.value.trim();


    if(!text){

        return;

    }


    /*
       Improvement 5:
       Clear both search fields.
    */

    manualInput.value = "";

    keywordInput.value = "";


    closeCardView();


    searchCancelled = true;

    isSearching = false;


    try{

        if(recognition){

            recognition.abort();

        }

    }
    catch(e){}


    lastHeardText = "";


    result.textContent =
        "Typed: " +
        text +
        "\nSearching...";


    searchCancelled = false;

    isSearching = true;

    stopButton.disabled = false;


    findBestCard(
        [text]
    );

}


/* =========================================================
   KEYWORD CATALOG
========================================================= */

async function getKeywordCatalog(
    catalogName
){

    try{

        const response =
            await fetch(
                "https://api.scryfall.com/catalog/" +
                catalogName
            );


        if(!response.ok){

            return null;

        }


        const data =
            await response.json();


        return data.data || null;

    }
    catch(error){

        console.error(error);

        return null;

    }

}


/* =========================================================
   FIND KEYWORD TYPE
========================================================= */

async function findKeywordType(
    keyword
){

    const normalized =
        normalizeText(keyword);


    if(!normalized){

        return null;

    }


    if(!keywordAbilitiesCache){

        keywordAbilitiesCache =
            await getKeywordCatalog(
                "keyword-abilities"
            );

    }


    if(!keywordActionsCache){

        keywordActionsCache =
            await getKeywordCatalog(
                "keyword-actions"
            );

    }


    if(!abilityWordsCache){

        abilityWordsCache =
            await getKeywordCatalog(
                "ability-words"
            );

    }


    function matches(list){

        if(!list){

            return false;

        }


        return list.some(
            function(item){

                return normalizeText(item) ===
                    normalized;

            }
        );

    }


    if(matches(keywordAbilitiesCache)){

        return "Keyword Ability";

    }


    if(matches(keywordActionsCache)){

        return "Keyword Action";

    }


    if(matches(abilityWordsCache)){

        return "Ability Word";

    }


    return null;

}

/* =========================================================
   ABILITY WORD EXPLANATION
========================================================= */

function getAbilityWordDefinition(
    keyword
){

    const normalized =
        normalizeText(keyword);


    if(
        abilityWordDefinitions[
            normalized
        ]
    ){

        return abilityWordDefinitions[
            normalized
        ];

    }


    return (
        "An ability word used to group abilities " +
        "that share a particular theme or condition. " +
        "Ability words have no rules meaning by themselves; " +
        "the actual effect is defined by the ability that follows the word."
    );

}


/* =========================================================
   EXTRACT REMINDER TEXT
========================================================= */

function extractReminderText(
    oracleText,
    keyword
){

    if(!oracleText){

        return null;

    }


    const lines =
        oracleText.split("\n");


    const normalizedKeyword =
        normalizeText(keyword);


    for(
        let i=0;
        i<lines.length;
        i++
    ){

        const line =
            lines[i];


        const normalizedLine =
            normalizeText(line);


        if(
            normalizedLine.includes(
                normalizedKeyword
            )
        ){

            const match =
                line.match(
                    /\(([^()]*)\)/
                );


            if(match){

                return match[1].trim();

            }

        }

    }


    return null;

}


/* =========================================================
   GET KEYWORD DESCRIPTION
========================================================= */

async function getKeywordDescription(
    keyword,
    keywordType
){

    if(searchCancelled){

        return null;

    }


    if(
        keywordType ===
        "Ability Word"
    ){

        return {

            description:
                getAbilityWordDefinition(
                    keyword
                ),

            sourceCard:null

        };

    }


    const query =
        "keyword:" +
        keyword +
        " lang:en";


    try{

        const response =
            await fetch(
                "https://api.scryfall.com/cards/search?q=" +
                encodeURIComponent(query) +
                "&unique=cards"
            );


        if(searchCancelled){

            return null;

        }


        if(!response.ok){

            return null;

        }


        const data =
            await response.json();


        if(
            !data.data ||
            !data.data.length
        ){

            return null;

        }


        for(
            const card of data.data
        ){

            if(searchCancelled){

                return null;

            }


            if(card.lang !== "en"){

                continue;

            }


            const description =
                extractReminderText(
                    card.oracle_text,
                    keyword
                );


            if(description){

                return {

                    description:description,

                    sourceCard:card.name

                };

            }

        }

    }
    catch(error){

        console.error(error);

    }


    return null;

}


/* =========================================================
   KEYWORD SEARCH
========================================================= */

keywordButton.addEventListener(
    "click",
    searchKeyword
);


keywordInput.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            searchKeyword();

        }

    }
);


async function searchKeyword(){

    const keyword =
        keywordInput.value.trim();


    if(!keyword){

        return;

    }


    keywordInput.value = "";


    closeCardView();


    searchCancelled = true;

    isSearching = false;


    try{

        if(recognition){

            recognition.abort();

        }

    }
    catch(e){}


    stopButton.disabled = true;


    keywordTitle.textContent =
        "";


    keywordDescription.textContent =
        "Searching...";


    searchCancelled = false;


    const keywordType =
        await findKeywordType(
            keyword
        );


    if(searchCancelled){

        return;

    }


    if(!keywordType){

        keywordTitle.textContent =
            keyword;


        keywordDescription.textContent =
            "Keyword not found.";


        keywordResult.scrollIntoView({

            behavior:"smooth",

            block:"start"

        });


        return;

    }


    keywordTitle.textContent =
        keyword +
        " — " +
        keywordType;


    const information =
        await getKeywordDescription(
            keyword,
            keywordType
        );


    if(searchCancelled){

        return;

    }


    if(information){

        keywordDescription.textContent =
            information.description;

    }
    else{

        keywordDescription.textContent =
            "No English explanation was found.";

    }


    keywordResult.scrollIntoView({

        behavior:"smooth",

        block:"start"

    });

}
