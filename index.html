<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTG Voice Card</title>

    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        button {
            font-size: 24px;
            padding: 20px 30px;
            border-radius: 15px;
            border: none;
            background: white;
            color: black;
        }

        button:disabled {
            opacity: 0.5;
        }

        #result {
            margin-top: 30px;
            font-size: 22px;
            max-width: 90%;
        }

        #card {
            display: none;
            max-width: 90%;
            max-height: 65vh;
            margin-top: 25px;
            border-radius: 12px;
        }
    </style>
</head>

<body>

    <button id="listenButton">🎤 Speak card name</button>

    <div id="result">
        Tap the button and say a Magic card name.
    </div>

    <img id="card" alt="Magic card">


<script>

const button = document.getElementById("listenButton");
const result = document.getElementById("result");
const cardImage = document.getElementById("card");

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


/* =========================================================
   SPEECH RECOGNITION
   ========================================================= */

if (!SpeechRecognition) {

    result.textContent =
        "Speech recognition is not supported.";

} else {

    const recognition = new SpeechRecognition();

    recognition.lang = "en-US";
    recognition.continuous = false;
    recognition.interimResults = false;

    // Ask Safari for several interpretations
    recognition.maxAlternatives = 5;

    let timeout;

    button.addEventListener("click", () => {

        clearTimeout(timeout);

        result.textContent = "🎤 Listening...";

        cardImage.style.display = "none";

        button.disabled = true;

        try {

            recognition.start();

        } catch (error) {

            console.log(error);

        }

        // Safety timeout
        timeout = setTimeout(() => {

            recognition.stop();

        }, 7000);

    });


    recognition.onresult = async (event) => {

        clearTimeout(timeout);

        recognition.stop();

        const candidates = [];

        for (
            let i = 0;
            i < event.results[0].length;
            i++
        ) {

            candidates.push(
                event.results[0][i].transcript.trim()
            );

        }

        console.log(
            "Speech alternatives:",
            candidates
        );

        result.textContent = "Searching...";

        await findBestCard(candidates);

    };


    recognition.onerror = (event) => {

        clearTimeout(timeout);

        result.textContent =
            "Speech error: " + event.error;

        button.disabled = false;

    };


    recognition.onend = () => {

        clearTimeout(timeout);

        button.disabled = false;

    };

}


/* =========================================================
   TEXT NORMALIZATION
   ========================================================= */

function normalizeText(text) {

    return text

        .toLowerCase()

        // Remove apostrophes
        .replace(/['’]/g, "")

        // Remove punctuation
        .replace(/[^a-z0-9\s]/g, " ")

        // Collapse multiple spaces
        .replace(/\s+/g, " ")

        .trim();
}


/* =========================================================
   LEVENSHTEIN DISTANCE
   ========================================================= */

function levenshtein(a, b) {

    const matrix = [];

    for (let i = 0; i <= b.length; i++) {

        matrix[i] = [i];

    }

    for (let j = 0; j <= a.length; j++) {

        matrix[0][j] = j;

    }

    for (let i = 1; i <= b.length; i++) {

        for (let j = 1; j <= a.length; j++) {

            if (b.charAt(i - 1) === a.charAt(j - 1)) {

                matrix[i][j] =
                    matrix[i - 1][j - 1];

            } else {

                matrix[i][j] = Math.min(

                    matrix[i - 1][j] + 1,

                    matrix[i][j - 1] + 1,

                    matrix[i - 1][j - 1] + 1

                );

            }

        }

    }

    return matrix[b.length][a.length];

}


/* =========================================================
   SIMILARITY SCORE
   ========================================================= */

function similarity(a, b) {

    a = normalizeText(a);
    b = normalizeText(b);

    if (!a || !b) {
        return 0;
    }

    if (a === b) {
        return 1;
    }

    const distance =
        levenshtein(a, b);

    const longest =
        Math.max(a.length, b.length);

    return 1 - (distance / longest);

}


/* =========================================================
   WORD-BASED SIMILARITY
   ========================================================= */

function wordSimilarity(a, b) {

    const wordsA =
        normalizeText(a).split(" ");

    const wordsB =
        normalizeText(b).split(" ");

    let total = 0;

    for (const wordA of wordsA) {

        let best = 0;

        for (const wordB of wordsB) {

            const score =
                similarity(wordA, wordB);

            if (score > best) {
                best = score;
            }

        }

        total += best;

    }

    if (wordsA.length === 0) {
        return 0;
    }

    return total / wordsA.length;

}


/* =========================================================
   COMBINED SIMILARITY
   ========================================================= */

function cardSimilarity(spoken, cardName) {

    const fullSimilarity =
        similarity(spoken, cardName);

    const wordScore =
        wordSimilarity(spoken, cardName);

    // Give slightly more importance to whole-name similarity
    return (
        fullSimilarity * 0.65 +
        wordScore * 0.35
    );

}


/* =========================================================
   GET ALL CARD NAMES FROM SCRYFALL
   ========================================================= */

let cardNamesCache = null;

async function getCardNames() {

    if (cardNamesCache) {
        return cardNamesCache;
    }

    try {

        const response =
            await fetch(
                "https://api.scryfall.com/catalog/card-names"
            );

        if (!response.ok) {
            return null;
        }

        const data =
            await response.json();

        cardNamesCache =
            data.data;

        return cardNamesCache;

    } catch (error) {

        console.error(
            "Could not download card names:",
            error
        );

        return null;
    }

}


/* =========================================================
   FIND CLOSEST CARD NAME
   ========================================================= */

async function findClosestCard(spokenText) {

    const cardNames =
        await getCardNames();

    if (!cardNames) {
        return null;
    }

    let bestName = null;
    let bestScore = 0;

    for (const cardName of cardNames) {

        const score =
            cardSimilarity(
                spokenText,
                cardName
            );

        if (score > bestScore) {

            bestScore = score;
            bestName = cardName;

        }

    }

    console.log(
        "Best fuzzy match:",
        bestName,
        bestScore
    );

    /*
       Minimum confidence.

       0.82 = reasonably strong match.
    */

    if (bestScore >= 0.82) {

        return {
            name: bestName,
            score: bestScore
        };

    }

    return null;

}


/* =========================================================
   SEARCH SCRYFALL
   ========================================================= */

async function findBestCard(candidates) {

    // Remove duplicates
    candidates =
        [...new Set(candidates)];


    /*
       STEP 1
       Try exact matches for every
       speech interpretation.
    */

    for (const candidate of candidates) {

        try {

            const url =
                "https://api.scryfall.com/cards/named?exact=" +
                encodeURIComponent(candidate);

            const response =
                await fetch(url);

            if (response.ok) {

                const data =
                    await response.json();

                showCard(data);

                return;

            }

        } catch (error) {

            console.error(error);

        }

    }


    /*
       STEP 2
       Fuzzy matching against all
       Scryfall card names.
    */

    result.textContent =
        "Finding closest card...";


    let bestMatch = null;
    let bestScore = 0;


    for (const candidate of candidates) {

        const match =
            await findClosestCard(candidate);

        if (
            match &&
            match.score > bestScore
        ) {

            bestMatch = match;
            bestScore = match.score;

        }

    }


    /*
       STEP 3
       Search the winning card
       by exact name.
    */

    if (bestMatch) {

        result.textContent =
            "Found: " + bestMatch.name;


        try {

            const url =
                "https://api.scryfall.com/cards/named?exact=" +
                encodeURIComponent(
                    bestMatch.name
                );

            const response =
                await fetch(url);

            if (response.ok) {

                const data =
                    await response.json();

                showCard(data);

                return;

            }

        } catch (error) {

            console.error(error);

        }

    }


    /*
       Nothing good enough found.
    */

    result.textContent =
        "Card not found.";

    button.disabled = false;

}


/* =========================================================
   DISPLAY CARD
   ========================================================= */

function showCard(data) {

    result.textContent =
        data.name;


    let imageURL = null;


    // Normal card
    if (
        data.image_uris &&
        data.image_uris.normal
    ) {

        imageURL =
            data.image_uris.normal;

    }


    // Double-faced card
    else if (
        data.card_faces &&
        data.card_faces[0] &&
        data.card_faces[0].image_uris
    ) {

        imageURL =
            data.card_faces[0]
                .image_uris
                .normal;

    }


    if (imageURL) {

        cardImage.src =
            imageURL;

        cardImage.style.display =
            "block";

    } else {

        result.textContent =
            data.name +
            " (no image available)";

    }

    button.disabled = false;

}

</script>

</body>
</html>
