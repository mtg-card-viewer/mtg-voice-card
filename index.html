<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTG Voice Card</title>

    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        button {
            font-size: 24px;
            padding: 20px 30px;
            border-radius: 15px;
            border: none;
            background: white;
            color: black;
        }

        #result {
            margin-top: 30px;
            font-size: 22px;
            max-width: 90%;
        }
    </style>
</head>

<body>

    <button id="listenButton">🎤 Speak card name</button>

    <div id="result">
        Tap the button and say a Magic card name.
    </div>

<script>

const button = document.getElementById("listenButton");
const result = document.getElementById("result");

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

if (!SpeechRecognition) {

    result.textContent =
        "Speech recognition is not supported.";

} else {

    const recognition = new SpeechRecognition();

    recognition.lang = "en-US";
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    let timeout;

    button.addEventListener("click", () => {

        clearTimeout(timeout);

        result.textContent = "🎤 Listening...";
        button.disabled = true;

        try {
            recognition.start();
        } catch (e) {
            console.log(e);
        }

        // Stop listening after 7 seconds
        timeout = setTimeout(() => {
            recognition.stop();
        }, 7000);

    });

    recognition.onresult = (event) => {

        clearTimeout(timeout);

        const spokenText =
            event.results[0][0].transcript.trim();

        result.textContent =
            "You said: " + spokenText;

        recognition.stop();
    };

    recognition.onerror = (event) => {

        clearTimeout(timeout);

        result.textContent =
            "Speech error: " + event.error;

        button.disabled = false;
    };

    recognition.onend = () => {

        clearTimeout(timeout);

        button.disabled = false;

    };

}

</script>

</body>
</html>
