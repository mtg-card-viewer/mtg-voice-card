<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTG Voice Card</title>

    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        button {
            font-size: 24px;
            padding: 20px 30px;
            border-radius: 15px;
            border: none;
            background: white;
            color: black;
        }

        button:disabled {
            opacity: 0.5;
        }

        #result {
            margin-top: 30px;
            font-size: 22px;
            max-width: 90%;
        }

        #card {
            display: none;
            max-width: 90%;
            max-height: 65vh;
            margin-top: 25px;
            border-radius: 12px;
        }
    </style>
</head>

<body>

    <button id="listenButton">🎤 Speak card name</button>

    <div id="result">
        Tap the button and say a Magic card name.
    </div>

    <img id="card" alt="Magic card">

<script>

const button = document.getElementById("listenButton");
const result = document.getElementById("result");
const cardImage = document.getElementById("card");

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

if (!SpeechRecognition) {

    result.textContent =
        "Speech recognition is not supported.";

} else {

    const recognition = new SpeechRecognition();

    recognition.lang = "en-US";
    recognition.continuous = false;
    recognition.interimResults = false;

    // Ask Safari for multiple interpretations
    recognition.maxAlternatives = 5;

    let timeout;

    button.addEventListener("click", () => {

        clearTimeout(timeout);

        result.textContent = "🎤 Listening...";
        cardImage.style.display = "none";
        button.disabled = true;

        try {
            recognition.start();
        } catch (e) {
            console.log(e);
        }

        timeout = setTimeout(() => {
            recognition.stop();
        }, 7000);

    });


    recognition.onresult = async (event) => {

        clearTimeout(timeout);

        recognition.stop();

        const alternatives = [];

        for (
            let i = 0;
            i < event.results[0].length;
            i++
        ) {

            alternatives.push(
                event.results[0][i].transcript.trim()
            );

        }

        console.log("Speech alternatives:", alternatives);

        result.textContent = "Searching...";

        await findBestCard(alternatives);
    };


    recognition.onerror = (event) => {

        clearTimeout(timeout);

        result.textContent =
            "Speech error: " + event.error;

        button.disabled = false;
    };


    recognition.onend = () => {

        clearTimeout(timeout);

        button.disabled = false;
    };
}


/*
    Try every speech interpretation.
    The first exact Scryfall match wins.
*/

async function findBestCard(candidates) {

    // Remove duplicate interpretations
    candidates = [...new Set(candidates)];

    for (const candidate of candidates) {

        try {

            const url =
                "https://api.scryfall.com/cards/named?exact=" +
                encodeURIComponent(candidate);

            const response = await fetch(url);

            if (response.ok) {

                const data = await response.json();

                showCard(data);

                return;
            }

        } catch (error) {

            console.error(error);
        }
    }


    /*
        No exact match was found.
        Now try Scryfall's normal search.
    */

    for (const candidate of candidates) {

        try {

            const url =
                "https://api.scryfall.com/cards/search?q=" +
                encodeURIComponent(candidate);

            const response = await fetch(url);

            if (!response.ok) {
                continue;
            }

            const data = await response.json();

            if (data.data && data.data.length > 0) {

                showCard(data.data[0]);

                return;
            }

        } catch (error) {

            console.error(error);
        }
    }


    result.textContent =
        "Card not found.";

    button.disabled = false;
}


/*
    Display the card
*/

function showCard(data) {

    result.textContent = data.name;

    let imageURL = null;


    // Normal single-faced card
    if (
        data.image_uris &&
        data.image_uris.normal
    ) {

        imageURL = data.image_uris.normal;

    }


    // Double-faced card
    else if (
        data.card_faces &&
        data.card_faces[0].image_uris
    ) {

        imageURL =
            data.card_faces[0].image_uris.normal;
    }


    if (imageURL) {

        cardImage.src = imageURL;
        cardImage.style.display = "block";

    } else {

        result.textContent =
            data.name +
            " (no image available)";
    }

    button.disabled = false;
}

</script>

</body>
</html>
