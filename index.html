<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MTG Voice Card</title>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
}

button{
    font-size:24px;
    padding:20px 30px;
    border-radius:15px;
    border:none;
    background:white;
    color:black;
}

button:disabled{
    opacity:.5;
}

#result{
    margin-top:25px;
    font-size:20px;
    max-width:90%;
    white-space:pre-line;
}

#card{
    display:none;
    max-width:90%;
    max-height:65vh;
    margin-top:20px;
    border-radius:12px;
}
</style>
</head>

<body>

<button id="listenButton">🎤 Speak card name</button>

<div id="result">
Tap the button and say a Magic card name.
</div>

<img id="card" alt="Magic card">

<script>

const button = document.getElementById("listenButton");
const result = document.getElementById("result");
const cardImage = document.getElementById("card");

let lastHeardText = "";
let cardNamesCache = null;

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

if (!SpeechRecognition) {

    result.textContent =
        "Speech recognition is not supported.";

} else {

    const recognition = new SpeechRecognition();

    recognition.lang = "en-US";
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.maxAlternatives = 5;

    let timeout;

    button.addEventListener("click", () => {

        clearTimeout(timeout);

        lastHeardText = "";

        cardImage.style.display = "none";

        result.textContent =
            "🎤 Listening...";

        button.disabled = true;

        try {
            recognition.start();
        }
        catch(e){
            console.log(e);
        }

        timeout = setTimeout(() => {

            recognition.stop();

        }, 3000);

    });

    recognition.onresult = async (event) => {

        clearTimeout(timeout);

        recognition.stop();

        const candidates = [];

        for(let i=0;i<event.results[0].length;i++){

            const transcript =
                event.results[0][i].transcript.trim();

            candidates.push(transcript);

            if(i===0){
                lastHeardText = transcript;
            }
        }

        result.textContent =
            "Heard: " + lastHeardText +
            "\nSearching...";

        await findBestCard(candidates);

    };

    recognition.onerror = (event) => {

        result.textContent =
            "Speech error: " + event.error;

        button.disabled = false;
    };

    recognition.onend = () => {

        clearTimeout(timeout);

        button.disabled = false;
    };
}


/* ==========================
   Text normalization
========================== */

function normalizeText(text){

    return text
        .toLowerCase()
        .replace(/['’]/g,"")
        .replace(/[^a-z0-9\s]/g," ")
        .replace(/\s+/g," ")
        .trim();
}


/* ==========================
   Levenshtein
========================== */

function levenshtein(a,b){

    const matrix=[];

    for(let i=0;i<=b.length;i++){
        matrix[i]=[i];
    }

    for(let j=0;j<=a.length;j++){
        matrix[0][j]=j;
    }

    for(let i=1;i<=b.length;i++){

        for(let j=1;j<=a.length;j++){

            if(b.charAt(i-1)===a.charAt(j-1)){

                matrix[i][j]=
                    matrix[i-1][j-1];

            }else{

                matrix[i][j]=Math.min(
                    matrix[i-1][j]+1,
                    matrix[i][j-1]+1,
                    matrix[i-1][j-1]+1
                );
            }
        }
    }

    return matrix[b.length][a.length];
}


/* ==========================
   Similarity
========================== */

function similarity(a,b){

    a = normalizeText(a);
    b = normalizeText(b);

    if(!a || !b){
        return 0;
    }

    if(a===b){
        return 1;
    }

    const distance =
        levenshtein(a,b);

    const longest =
        Math.max(a.length,b.length);

    return 1 - (distance / longest);
}


/* ==========================
   Download card names
========================== */

async function getCardNames(){

    if(cardNamesCache){
        return cardNamesCache;
    }

    try{

        const response =
            await fetch(
                "https://api.scryfall.com/catalog/card-names"
            );

        const data =
            await response.json();

        cardNamesCache =
            data.data;

        return cardNamesCache;

    }catch(error){

        console.error(error);

        return null;
    }
}


/* ==========================
   Fuzzy match
========================== */

async function findClosestCard(spoken){

    const cardNames =
        await getCardNames();

    if(!cardNames){
        return null;
    }

    let bestName = null;
    let bestScore = 0;

    for(const cardName of cardNames){

        const score =
            similarity(
                spoken,
                cardName
            );

        if(score > bestScore){

            bestScore = score;
            bestName = cardName;
        }
    }

    if(bestScore >= 0.82){

        return {
            name: bestName,
            score: bestScore
        };
    }

    return null;
}


/* ==========================
   Main search
========================== */

async function findBestCard(candidates){

    candidates =
        [...new Set(candidates)];

    // Exact match first

    for(const candidate of candidates){

        try{

            const response =
                await fetch(
                    "https://api.scryfall.com/cards/named?exact=" +
                    encodeURIComponent(candidate)
                );

            if(response.ok){

                const data =
                    await response.json();

                showCard(
                    data,
                    data.name
                );

                return;
            }

        }catch(error){
            console.error(error);
        }
    }

    // Fuzzy match

    let bestMatch = null;
    let bestScore = 0;

    for(const candidate of candidates){

        const match =
            await findClosestCard(candidate);

        if(
            match &&
            match.score > bestScore
        ){

            bestMatch = match;
            bestScore = match.score;
        }
    }

    if(bestMatch){

        try{

            const response =
                await fetch(
                    "https://api.scryfall.com/cards/named?exact=" +
                    encodeURIComponent(bestMatch.name)
                );

            if(response.ok){

                const data =
                    await response.json();

                showCard(
                    data,
                    bestMatch.name
                );

                return;
            }

        }catch(error){
            console.error(error);
        }
    }

    result.textContent =
        "Heard: " + lastHeardText +
        "\nCard not found.";

    button.disabled = false;
}


/* ==========================
   Show card
========================== */

function showCard(data, matchedName){

    result.textContent =
        "Heard: " + lastHeardText +
        "\nMatched: " + matchedName;

    let imageURL = null;

    if(
        data.image_uris &&
        data.image_uris.normal
    ){
        imageURL =
            data.image_uris.normal;
    }
    else if(
        data.card_faces &&
        data.card_faces[0] &&
        data.card_faces[0].image_uris
    ){
        imageURL =
            data.card_faces[0]
                .image_uris
                .normal;
    }

    if(imageURL){

        cardImage.src = imageURL;
        cardImage.style.display = "block";
    }

    button.disabled = false;
}

</script>

</body>
</html>
