<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MTG Voice Card</title>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
}

button{
    font-size:24px;
    padding:20px 30px;
    border-radius:15px;
    border:none;
    background:white;
    color:black;
}

button:disabled{
    opacity:.5;
}

#result{
    margin-top:25px;
    font-size:20px;
    max-width:90%;
    white-space:pre-line;
}

#card{
    display:none;
    max-width:90%;
    max-height:65vh;
    margin-top:20px;
    border-radius:12px;
}
</style>
</head>

<body>

<button id="listenButton">🎤 Speak card name</button>

<div id="result">
Tap the button and say a Magic card name.
</div>

<img id="card" alt="Magic card">

<script>

const button = document.getElementById("listenButton");
const result = document.getElementById("result");
const cardImage = document.getElementById("card");

let lastHeardText = "";
let cardNamesCache = null;
let foundMethod = "";

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


/* =========================================================
   SPEECH RECOGNITION
   ========================================================= */

if (!SpeechRecognition) {

    result.textContent =
        "Speech recognition is not supported.";

} else {

    const recognition = new SpeechRecognition();

    recognition.lang = "en-US";
    recognition.continuous = false;
    recognition.interimResults = false;

    // Ask Safari for multiple interpretations
    recognition.maxAlternatives = 5;

    let timeout;

    button.addEventListener("click", () => {

        clearTimeout(timeout);

        lastHeardText = "";
        foundMethod = "";

        cardImage.style.display = "none";

        result.textContent =
            "🎤 Listening...";

        button.disabled = true;

        try {
            recognition.start();
        }
        catch(e) {
            console.log(e);
        }

        // Maximum listening time: 3 seconds
        timeout = setTimeout(() => {

            recognition.stop();

        }, 3000);

    });


    recognition.onresult = async (event) => {

        clearTimeout(timeout);

        recognition.stop();

        const candidates = [];

        for(
            let i = 0;
            i < event.results[0].length;
            i++
        ){

            const transcript =
                event.results[0][i].transcript.trim();

            candidates.push(transcript);

            if(i === 0){

                lastHeardText =
                    transcript;
            }
        }

        result.textContent =
            "Heard: " + lastHeardText +
            "\nSearching...";

        await findBestCard(candidates);

    };


    recognition.onerror = (event) => {

        result.textContent =
            "Speech error: " + event.error;

        button.disabled = false;
    };


    recognition.onend = () => {

        clearTimeout(timeout);

        button.disabled = false;
    };
}


/* =========================================================
   TEXT NORMALIZATION
   ========================================================= */

function normalizeText(text){

    return text
        .toLowerCase()
        .replace(/['’]/g,"")
        .replace(/[^a-z0-9\s]/g," ")
        .replace(/\s+/g," ")
        .trim();
}


/* =========================================================
   LEVENSHTEIN DISTANCE
   ========================================================= */

function levenshtein(a,b){

    const matrix = [];

    for(let i=0;i<=b.length;i++){
        matrix[i] = [i];
    }

    for(let j=0;j<=a.length;j++){
        matrix[0][j] = j;
    }

    for(let i=1;i<=b.length;i++){

        for(let j=1;j<=a.length;j++){

            if(
                b.charAt(i-1) ===
                a.charAt(j-1)
            ){

                matrix[i][j] =
                    matrix[i-1][j-1];

            } else {

                matrix[i][j] =
                    Math.min(
                        matrix[i-1][j] + 1,
                        matrix[i][j-1] + 1,
                        matrix[i-1][j-1] + 1
                    );
            }
        }
    }

    return matrix[b.length][a.length];
}


/* =========================================================
   NORMAL TEXT SIMILARITY
   ========================================================= */

function similarity(a,b){

    a = normalizeText(a);
    b = normalizeText(b);

    if(!a || !b){
        return 0;
    }

    if(a === b){
        return 1;
    }

    const distance =
        levenshtein(a,b);

    const longest =
        Math.max(a.length,b.length);

    return 1 -
        (distance / longest);
}


/* =========================================================
   PHONETIC NORMALIZATION
   =========================================================

   This deliberately uses a broad phonetic approximation
   rather than standard Soundex.

   The goal is Magic card names spoken by English speech
   recognition, not surnames.
========================================================= */

function phoneticNormalize(text){

    let s = normalizeText(text);

    /*
       Common speech variations
    */

    s = s
        .replace(/ph/g,"f")
        .replace(/th/g,"t")
        .replace(/wh/g,"w")
        .replace(/ck/g,"k")
        .replace(/qu/g,"kw")
        .replace(/c(?=[eiy])/g,"s")
        .replace(/c/g,"k")
        .replace(/q/g,"k")
        .replace(/x/g,"ks")
        .replace(/z/g,"s")
        .replace(/j/g,"y");


    /*
       Some common MTG/fantasy-name
       pronunciation variations.
    */

    s = s
        .replace(/ae/g,"a")
        .replace(/oe/g,"o")
        .replace(/ee/g,"i")
        .replace(/oo/g,"u")
        .replace(/ou/g,"u");


    /*
       Remove repeated letters.
    */

    s = s.replace(/(.)\1+/g,"$1");


    /*
       Remove many vowels after the
       first character of each word.

       This makes:
       Yawgmoth
       yogmoth
       yegmoth

       much more similar.
    */

    const words = s.split(" ");

    const processed = words.map(word => {

        if(word.length <= 2){
            return word;
        }

        const first = word.charAt(0);

        const rest =
            word
                .substring(1)
                .replace(/[aeiou]/g,"");

        return first + rest;

    });

    return processed.join(" ");
}


/* =========================================================
   PHONETIC SIMILARITY
   ========================================================= */

function phoneticSimilarity(a,b){

    const pa =
        phoneticNormalize(a);

    const pb =
        phoneticNormalize(b);

    if(!pa || !pb){
        return 0;
    }

    if(pa === pb){
        return 1;
    }

    return similarity(pa,pb);
}


/* =========================================================
   WORD-BASED PHONETIC SCORE
   ========================================================= */

function wordPhoneticSimilarity(a,b){

    const wordsA =
        phoneticNormalize(a)
            .split(" ")
            .filter(Boolean);

    const wordsB =
        phoneticNormalize(b)
            .split(" ")
            .filter(Boolean);

    if(
        wordsA.length === 0 ||
        wordsB.length === 0
    ){
        return 0;
    }

    let total = 0;

    for(const wordA of wordsA){

        let best = 0;

        for(const wordB of wordsB){

            const score =
                similarity(
                    wordA,
                    wordB
                );

            if(score > best){
                best = score;
            }
        }

        total += best;
    }

    return total / wordsA.length;
}


/* =========================================================
   COMBINED PHONETIC SCORE
   ========================================================= */

function cardPhoneticScore(spoken,cardName){

    const whole =
        phoneticSimilarity(
            spoken,
            cardName
        );

    const words =
        wordPhoneticSimilarity(
            spoken,
            cardName
        );

    /*
       Whole phrase gets slightly more weight.
    */

    return (
        whole * 0.60 +
        words * 0.40
    );
}


/* =========================================================
   DOWNLOAD CARD NAMES
   ========================================================= */

async function getCardNames(){

    if(cardNamesCache){
        return cardNamesCache;
    }

    try{

        const response =
            await fetch(
                "https://api.scryfall.com/catalog/card-names"
            );

        if(!response.ok){
            return null;
        }

        const data =
            await response.json();

        cardNamesCache =
            data.data;

        return cardNamesCache;

    }catch(error){

        console.error(
            "Could not download card names:",
            error
        );

        return null;
    }
}


/* =========================================================
   LOCAL FUZZY MATCH
   ========================================================= */

async function findClosestCard(spoken){

    const cardNames =
        await getCardNames();

    if(!cardNames){
        return null;
    }

    let bestName = null;
    let bestScore = 0;

    for(const cardName of cardNames){

        const score =
            similarity(
                spoken,
                cardName
            );

        if(score > bestScore){

            bestScore = score;
            bestName = cardName;
        }
    }

    if(bestScore >= 0.82){

        return {
            name: bestName,
            score: bestScore
        };
    }

    return null;
}


/* =========================================================
   PHONETIC MATCH
   ========================================================= */

async function findPhoneticCard(candidates){

    const cardNames =
        await getCardNames();

    if(!cardNames){
        return null;
    }

    let bestName = null;
    let bestScore = 0;

    for(const candidate of candidates){

        for(const cardName of cardNames){

            const score =
                cardPhoneticScore(
                    candidate,
                    cardName
                );

            if(score > bestScore){

                bestScore = score;
                bestName = cardName;
            }
        }
    }

    console.log(
        "Best phonetic match:",
        bestName,
        bestScore
    );


    /*
       Fairly high threshold to avoid
       displaying the wrong card.

       We can tune this after testing.
    */

    if(bestScore >= 0.78){

        return {
            name: bestName,
            score: bestScore
        };
    }

    return null;
}


/* =========================================================
   MAIN SEARCH
   ========================================================= */

async function findBestCard(candidates){

    candidates =
        [...new Set(candidates)];


    /*
       STEP 1
       Exact Match
    */

    for(const candidate of candidates){

        try{

            const response =
                await fetch(
                    "https://api.scryfall.com/cards/named?exact=" +
                    encodeURIComponent(candidate)
                );

            if(response.ok){

                const data =
                    await response.json();

                foundMethod =
                    "Exact Match";

                showCard(
                    data,
                    data.name
                );

                return;
            }

        }catch(error){

            console.error(error);

        }
    }


    /*
       STEP 2
       Scryfall Fuzzy
    */

    for(const candidate of candidates){

        try{

            const response =
                await fetch(
                    "https://api.scryfall.com/cards/named?fuzzy=" +
                    encodeURIComponent(candidate)
                );

            if(response.ok){

                const data =
                    await response.json();

                foundMethod =
                    "Scryfall Fuzzy";

                showCard(
                    data,
                    data.name
                );

                return;
            }

        }catch(error){

            console.error(error);

        }
    }


    /*
       STEP 3
       Local Fuzzy
    */

    let bestLocalMatch = null;
    let bestLocalScore = 0;

    for(const candidate of candidates){

        const match =
            await findClosestCard(candidate);

        if(
            match &&
            match.score > bestLocalScore
        ){

            bestLocalMatch = match;
            bestLocalScore = match.score;
        }
    }


    if(bestLocalMatch){

        try{

            const response =
                await fetch(
                    "https://api.scryfall.com/cards/named?exact=" +
                    encodeURIComponent(
                        bestLocalMatch.name
                    )
                );

            if(response.ok){

                const data =
                    await response.json();

                foundMethod =
                    "Local Fuzzy";

                showCard(
                    data,
                    bestLocalMatch.name
                );

                return;
            }

        }catch(error){

            console.error(error);

        }
    }


    /*
       STEP 4
       Phonetic Match
    */

    result.textContent =
        "Heard: " + lastHeardText +
        "\nTrying phonetic match...";


    const phoneticMatch =
        await findPhoneticCard(
            candidates
        );


    if(phoneticMatch){

        try{

            const response =
                await fetch(
                    "https://api.scryfall.com/cards/named?exact=" +
                    encodeURIComponent(
                        phoneticMatch.name
                    )
                );

            if(response.ok){

                const data =
                    await response.json();

                foundMethod =
                    "Phonetic Match";

                showCard(
                    data,
                    phoneticMatch.name
                );

                return;
            }

        }catch(error){

            console.error(error);

        }
    }


    /*
       Nothing good enough found
    */

    result.textContent =
        "Heard: " + lastHeardText +
        "\nCard not found.";

    button.disabled = false;
}


/* =========================================================
   SHOW CARD
   ========================================================= */

function showCard(data,matchedName){

    result.textContent =
        "Heard: " + lastHeardText +
        "\nFound by: " + foundMethod +
        "\nMatched: " + matchedName;

    let imageURL = null;


    /*
       Normal single-faced card
    */

    if(
        data.image_uris &&
        data.image_uris.normal
    ){

        imageURL =
            data.image_uris.normal;
    }


    /*
       Double-faced card
    */

    else if(
        data.card_faces &&
        data.card_faces[0] &&
        data.card_faces[0].image_uris
    ){

        imageURL =
            data.card_faces[0]
                .image_uris
                .normal;
    }


    if(imageURL){

        cardImage.src =
            imageURL;

        cardImage.style.display =
            "block";

    }else{

        result.textContent =
            "Heard: " + lastHeardText +
            "\nFound by: " + foundMethod +
            "\nMatched: " + matchedName +
            "\n(no image available)";
    }

    button.disabled = false;
}

</script>

</body>
</html>
