<script>


/* =========================================================
   ELEMENTS
========================================================= */

const button =
    document.getElementById(
        "listenButton"
    );

const stopButton =
    document.getElementById(
        "stopButton"
    );

const result =
    document.getElementById(
        "result"
    );

const manualInput =
    document.getElementById(
        "manualInput"
    );

const manualButton =
    document.getElementById(
        "manualButton"
    );

const keywordInput =
    document.getElementById(
        "keywordInput"
    );

const keywordButton =
    document.getElementById(
        "keywordButton"
    );

const keywordResult =
    document.getElementById(
        "keywordResult"
    );

const keywordTitle =
    document.getElementById(
        "keywordTitle"
    );

const keywordDescription =
    document.getElementById(
        "keywordDescription"
    );

const cardView =
    document.getElementById(
        "cardView"
    );

const fullscreenCard =
    document.getElementById(
        "fullscreenCard"
    );


/* =========================================================
   VARIABLES
========================================================= */

let lastHeardText = "";

let cardNamesCache = null;

let recognition = null;

let timeout = null;

let searchCancelled = false;

let isSearching = false;

let keywordAbilitiesCache = null;

let keywordActionsCache = null;

let abilityWordsCache = null;


/* =========================================================
   SPEECH RECOGNITION
========================================================= */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if(!SpeechRecognition){

    result.textContent =
        "Speech recognition is not supported.";

}
else{

    recognition =
        new SpeechRecognition();

    recognition.lang =
        "en-US";

    recognition.continuous =
        false;

    recognition.interimResults =
        false;

    recognition.maxAlternatives =
        5;


    button.addEventListener(
        "click",
        startListening
    );


    stopButton.addEventListener(
        "click",
        stopSearch
    );


    recognition.onresult =
        async function(event){

            clearTimeout(timeout);


            const candidates = [];


            /*
               Improvement 8:
               Use ALL speech alternatives,
               not just alternative 1.
            */

            for(
                let i=0;
                i<event.results[0].length;
                i++
            ){

                const transcript =
                    event.results[0][i]
                    .transcript
                    .trim();


                if(
                    transcript &&
                    !candidates.includes(
                        transcript
                    )
                ){

                    candidates.push(
                        transcript
                    );

                }

            }


            if(candidates.length){

                lastHeardText =
                    candidates[0];

            }


            result.textContent =
                "Heard: " +
                lastHeardText +
                "\nSearching...";


            try{

                recognition.stop();

            }
            catch(e){}


            button.disabled = false;

            isSearching = true;

            stopButton.disabled = false;

            searchCancelled = false;


            await findBestCard(
                candidates
            );

        };


    recognition.onerror =
        function(event){

            clearTimeout(timeout);

            button.disabled = false;


            if(!isSearching){

                stopButton.disabled = true;

            }


            if(event.error !== "aborted"){

                result.textContent =
                    "Speech error: " +
                    event.error;

            }

        };


    recognition.onend =
        function(){

            clearTimeout(timeout);

            button.disabled = false;


            if(!isSearching){

                stopButton.disabled = true;

            }

        };

}


/* =========================================================
   START LISTENING
========================================================= */

function startListening(){

    if(!recognition){

        return;

    }


    closeCardView();


    clearTimeout(timeout);


    /*
       Improvement 5:
       Clear card search field.
    */

    manualInput.value = "";


    /*
       Improvement 5:
       Clear keyword search field.
    */

    keywordInput.value = "";


    searchCancelled = true;

    isSearching = false;

    lastHeardText = "";


    result.textContent =
        "🎤 Listening...";


    button.disabled = true;

    stopButton.disabled = true;


    searchCancelled = false;


    try{

        recognition.start();

    }
    catch(error){

        console.log(error);

        button.disabled = false;

        stopButton.disabled = true;

    }


    timeout =
        setTimeout(
            function(){

                try{

                    recognition.stop();

                }
                catch(e){}

            },
            3000
        );

}


/* =========================================================
   STOP SEARCH
========================================================= */

function stopSearch(){

    clearTimeout(timeout);


    searchCancelled = true;

    isSearching = false;


    stopButton.disabled = true;

    button.disabled = false;


    result.textContent =
        "⏹ Search stopped.";

}


/* =========================================================
   NORMALIZE
========================================================= */

function normalizeText(text){

    return text
        .toLowerCase()
        .replace(/['’]/g,"")
        .replace(/[^a-z0-9\s]/g," ")
        .replace(/\s+/g," ")
        .trim();

}


/* =========================================================
   COMPACT NORMALIZATION
=========================================================

   Improvement 8:
   Removes spaces and punctuation.

   Example:

   "Wisp mayor"
        ↓
   "wispmayor"

   "Wisp-mare"
        ↓
   "wispmare"

========================================================= */

function compactText(text){

    return normalizeText(text)
        .replace(/\s+/g,"");

}


/* =========================================================
   LEVENSHTEIN
========================================================= */

function levenshtein(a,b){

    const matrix=[];


    for(let i=0;i<=b.length;i++){

        matrix[i]=[i];

    }


    for(let j=0;j<=a.length;j++){

        matrix[0][j]=j;

    }


    for(let i=1;i<=b.length;i++){

        for(let j=1;j<=a.length;j++){

            if(
                b.charAt(i-1) ===
                a.charAt(j-1)
            ){

                matrix[i][j] =
                    matrix[i-1][j-1];

            }
            else{

                matrix[i][j] =
                    Math.min(
                        matrix[i-1][j]+1,
                        matrix[i][j-1]+1,
                        matrix[i-1][j-1]+1
                    );

            }

        }

    }


    return matrix[b.length][a.length];

}


/* =========================================================
   SIMILARITY
========================================================= */

function similarity(a,b){

    a = normalizeText(a);

    b = normalizeText(b);


    if(!a || !b){

        return 0;

    }


    if(a === b){

        return 1;

    }


    const distance =
        levenshtein(a,b);


    const longest =
        Math.max(
            a.length,
            b.length
        );


    return 1 -
        distance / longest;

}


/* =========================================================
   COMPACT SIMILARITY
=========================================================

   Improvement 8.

   This is the important part for cases such as:

       Wisp mayor
       Wish mayor

   compared against:

       Wispmare

========================================================= */

function compactSimilarity(a,b){

    a =
        compactText(a);

    b =
        compactText(b);


    if(!a || !b){

        return 0;

    }


    if(a === b){

        return 1;

    }


    const distance =
        levenshtein(a,b);


    const longest =
        Math.max(
            a.length,
            b.length
        );


    return 1 -
        distance / longest;

}


/* =========================================================
   PHONETIC NORMALIZATION
========================================================= */

function phoneticNormalize(text){

    let s =
        normalizeText(text);


    s =
        s
        .replace(/ph/g,"f")
        .replace(/th/g,"t")
        .replace(/wh/g,"w")
        .replace(/ck/g,"k")
        .replace(/qu/g,"kw")
        .replace(/c(?=[eiy])/g,"s")
        .replace(/c/g,"k")
        .replace(/q/g,"k")
        .replace(/x/g,"ks")
        .replace(/z/g,"s")
        .replace(/j/g,"y")
        .replace(/ae/g,"a")
        .replace(/oe/g,"o")
        .replace(/ee/g,"i")
        .replace(/oo/g,"u")
        .replace(/ou/g,"u");


    s =
        s.replace(
            /(.)\1+/g,
            "$1"
        );


    return s;

}


/* =========================================================
   COMPACT PHONETIC NORMALIZATION
========================================================= */

function compactPhoneticNormalize(text){

    return phoneticNormalize(text)
        .replace(/\s+/g,"");

}


/* =========================================================
   PHONETIC SCORE
========================================================= */

function phoneticSimilarity(a,b){

    return similarity(
        phoneticNormalize(a),
        phoneticNormalize(b)
    );

}


/* =========================================================
   COMPACT PHONETIC SCORE
=========================================================

   Improvement 8.

   "Wisp mayor"
        ↓
   "wispmayor"

   versus

   "Wispmare"
        ↓
   "wispmare"

========================================================= */

function compactPhoneticSimilarity(a,b){

    a =
        compactPhoneticNormalize(a);

    b =
        compactPhoneticNormalize(b);


    if(!a || !b){

        return 0;

    }


    if(a === b){

        return 1;

    }


    const distance =
        levenshtein(a,b);


    const longest =
        Math.max(
            a.length,
            b.length
        );


    return 1 -
        distance / longest;

}


/* =========================================================
   WORD SCORE
=========================================================

   Improvement 8.

   Compares individual spoken words against
   individual words in the card name.

   This helps when speech recognition introduces
   spaces into a single card name.

========================================================= */

function wordSimilarityScore(
    spoken,
    cardName
){

    const spokenWords =
        normalizeText(
            spoken
        ).split(" ")
        .filter(Boolean);


    const cardWords =
        normalizeText(
            cardName
        ).split(" ")
        .filter(Boolean);


    if(
        !spokenWords.length ||
        !cardWords.length
    ){

        return 0;

    }


    let total = 0;

    let matches = 0;


    for(
        const spokenWord of spokenWords
    ){

        let best = 0;


        for(
            const cardWord of cardWords
        ){

            const score =
                similarity(
                    spokenWord,
                    cardWord
                );


            if(score > best){

                best = score;

            }

        }


        total += best;

        matches++;

    }


    if(!matches){

        return 0;

    }


    return total / matches;

}


/* =========================================================
   PREFIX / SUFFIX SUPPORT
=========================================================

   Helps when speech recognition slightly changes
   the beginning or ending of a word.

========================================================= */

function partialWordScore(
    spoken,
    cardName
){

    const a =
        compactText(spoken);

    const b =
        compactText(cardName);


    if(!a || !b){

        return 0;

    }


    const minLength =
        Math.min(
            a.length,
            b.length
        );


    if(minLength < 4){

        return 0;

    }


    let prefix = 0;


    while(
        prefix < minLength &&
        a[prefix] === b[prefix]
    ){

        prefix++;

    }


    let suffix = 0;


    while(
        suffix < minLength &&
        a[a.length - 1 - suffix] ===
        b[b.length - 1 - suffix]
    ){

        suffix++;

    }


    const prefixScore =
        prefix / minLength;


    const suffixScore =
        suffix / minLength;


    return Math.max(
        prefixScore,
        suffixScore
    );

}


/* =========================================================
   CARD NAME SCORE
=========================================================

   Improvement 8 — MAIN MATCHER.

   Instead of relying on one similarity method,
   combine several independent ways of interpreting
   the spoken name.

========================================================= */

function cardNameScore(
    spoken,
    cardName
){

    if(!spoken || !cardName){

        return 0;

    }


    /*
       1. Normal full-string similarity
    */

    const normal =
        similarity(
            spoken,
            cardName
        );


    /*
       2. Ignore spaces.
    */

    const compact =
        compactSimilarity(
            spoken,
            cardName
        );


    /*
       3. Normal phonetic.
    */

    const phonetic =
        phoneticSimilarity(
            spoken,
            cardName
        );


    /*
       4. Phonetic without spaces.
    */

    const compactPhonetic =
        compactPhoneticSimilarity(
            spoken,
            cardName
        );


    /*
       5. Individual words.
    */

    const words =
        wordSimilarityScore(
            spoken,
            cardName
        );


    /*
       6. Beginning / ending.
    */

    const partial =
        partialWordScore(
            spoken,
            cardName
        );


    /*
       Weighted combination.

       Compact matching gets a strong weight because
       it specifically addresses speech recognition
       adding/removing spaces.

       We still keep the other methods so that normal
       names are not disadvantaged.
    */

    const score =
        (
            normal * 0.20 +
            compact * 0.30 +
            phonetic * 0.15 +
            compactPhonetic * 0.20 +
            words * 0.10 +
            partial * 0.05
        );


    return score;

}


/* =========================================================
   CARD NAMES
========================================================= */

async function getCardNames(){

    if(cardNamesCache){

        return cardNamesCache;

    }


    try{

        const response =
            await fetch(
                "https://api.scryfall.com/catalog/card-names"
            );


        if(!response.ok){

            return null;

        }


        const data =
            await response.json();


        cardNamesCache =
            data.data;


        return cardNamesCache;

    }
    catch(error){

        console.error(error);

        return null;

    }

}


/* =========================================================
   GET ENGLISH CARD
========================================================= */

async function getEnglishCard(
    cardName
){

    if(searchCancelled){

        return null;

    }


    try{

        const query =
            '!"' +
            cardName +
            '" lang:en';


        const response =
            await fetch(
                "https://api.scryfall.com/cards/search?q=" +
                encodeURIComponent(query)
            );


        if(searchCancelled){

            return null;

        }


        if(!response.ok){

            return null;

        }


        const data =
            await response.json();


        if(
            data.data &&
            data.data.length
        ){

            for(
                const card of data.data
            ){

                if(
                    card.lang === "en" &&
                    card.name.toLowerCase() ===
                    cardName.toLowerCase()
                ){

                    return card;

                }

            }

        }

    }
    catch(error){

        console.error(error);

    }


    return null;

}


/* =========================================================
   LOCAL FUZZY
=========================================================

   Improvement 8:
   Uses the new multi-factor cardNameScore().
========================================================= */

async function findClosestCard(
    spoken
){

    const cardNames =
        await getCardNames();


    if(!cardNames){

        return null;

    }


    let bestName = null;

    let bestScore = 0;


    for(
        const cardName of cardNames
    ){

        if(searchCancelled){

            return null;

        }


        const score =
            cardNameScore(
                spoken,
                cardName
            );


        if(score > bestScore){

            bestScore = score;

            bestName = cardName;

        }

    }


    /*
       Slightly lower threshold than the old
       simple fuzzy matcher because the new score
       combines several independent signals.

       We still require a reasonably strong match
       to avoid random cards.
    */

    if(bestScore >= 0.72){

        return {

            name:bestName,

            score:bestScore

        };

    }


    return null;

}


/* =========================================================
   MULTI-ALTERNATIVE LOCAL SEARCH
=========================================================

   Improvement 8.

   Every speech alternative is compared against
   every card name.

   The best combination wins.

========================================================= */

async function findBestLocalMatch(
    candidates
){

    const cardNames =
        await getCardNames();


    if(!cardNames){

        return null;

    }


    let bestName = null;

    let bestScore = 0;

    let bestSpoken = null;


    for(
        const candidate of candidates
    ){

        for(
            const cardName of cardNames
        ){

            if(searchCancelled){

                return null;

            }


            const score =
                cardNameScore(
                    candidate,
                    cardName
                );


            if(score > bestScore){

                bestScore = score;

                bestName = cardName;

                bestSpoken = candidate;

            }

        }

    }


    if(bestScore >= 0.72){

        return {

            name:bestName,

            score:bestScore,

            spoken:bestSpoken

        };

    }


    return null;

}


/* =========================================================
   PHONETIC SEARCH
========================================================= */

async function findPhoneticCard(
    candidates
){

    const cardNames =
        await getCardNames();


    if(!cardNames){

        return null;

    }


    let bestName = null;

    let bestScore = 0;

    let bestSpoken = null;


    for(
        const candidate of candidates
    ){

        for(
            const cardName of cardNames
        ){

            if(searchCancelled){

                return null;

            }


            /*
               Improvement 8:
               Use compact phonetic comparison too.
            */

            const normalScore =
                phoneticSimilarity(
                    candidate,
                    cardName
                );


            const compactScore =
                compactPhoneticSimilarity(
                    candidate,
                    cardName
                );


            const score =
                Math.max(
                    normalScore,
                    compactScore
                );


            if(score > bestScore){

                bestScore = score;

                bestName = cardName;

                bestSpoken = candidate;

            }

        }

    }


    console.log(
        "Phonetic:",
        bestName,
        bestScore,
        bestSpoken
    );


    if(bestScore >= 0.74){

        return {

            name:bestName,

            score:bestScore,

            spoken:bestSpoken

        };

    }


    return null;

}


/* =========================================================
   MAIN CARD SEARCH
========================================================= */

async function findBestCard(
    candidates
){

    searchCancelled = false;

    isSearching = true;

    stopButton.disabled = false;


    /* -----------------------------------------------------
       1. EXACT
    ----------------------------------------------------- */

    for(
        const candidate of candidates
    ){

        if(searchCancelled){

            return;

        }


        try{

            const response =
                await fetch(
                    "https://api.scryfall.com/cards/named?exact=" +
                    encodeURIComponent(candidate)
                );


            if(searchCancelled){

                return;

            }


            if(response.ok){

                const data =
                    await response.json();


                const englishCard =
                    await getEnglishCard(
                        data.name
                    );


                if(searchCancelled){

                    return;

                }


                if(englishCard){

                    showCard(
                        englishCard,
                        englishCard.name,
                        "Exact Match"
                    );


                    isSearching = false;

                    stopButton.disabled = true;

                    return;

                }

            }

        }
        catch(error){

            console.error(error);

        }

    }


    /* -----------------------------------------------------
       2. SCRYFALL FUZZY
    ----------------------------------------------------- */

    for(
        const candidate of candidates
    ){

        if(searchCancelled){

            return;

        }


        try{

            const response =
                await fetch(
                    "https://api.scryfall.com/cards/named?fuzzy=" +
                    encodeURIComponent(candidate)
                );


            if(searchCancelled){

                return;

            }


            if(response.ok){

                const data =
                    await response.json();


                const englishCard =
                    await getEnglishCard(
                        data.name
                    );


                if(searchCancelled){

                    return;

                }


                if(englishCard){

                    showCard(
                        englishCard,
                        englishCard.name,
                        "Scryfall Fuzzy"
                    );


                    isSearching = false;

                    stopButton.disabled = true;

                    return;

                }

            }

        }
        catch(error){

            console.error(error);

        }

    }


    /* -----------------------------------------------------
       3. IMPROVED LOCAL MATCH
    ----------------------------------------------------- */

    result.textContent =
        "Heard: " +
        lastHeardText +
        "\nTrying Local Fuzzy...";


    /*
       Improvement 8:
       Use all speech alternatives together.
    */

    const localMatch =
        await findBestLocalMatch(
            candidates
        );


    if(searchCancelled){

        return;

    }


    if(localMatch){

        console.log(
            "Local match:",
            localMatch.name,
            localMatch.score,
            "from:",
            localMatch.spoken
        );


        const englishCard =
            await getEnglishCard(
                localMatch.name
            );


        if(searchCancelled){

            return;

        }


        if(englishCard){

            showCard(
                englishCard,
                englishCard.name,
                "Local Fuzzy"
            );


            isSearching = false;

            stopButton.disabled = true;

            return;

        }

    }


    /* -----------------------------------------------------
       4. PHONETIC
    ----------------------------------------------------- */

    result.textContent =
        "Heard: " +
        lastHeardText +
        "\nTrying Phonetic Match...";


    const phonetic =
        await findPhoneticCard(
            candidates
        );


    if(searchCancelled){

        return;

    }


    if(phonetic){

        const englishCard =
            await getEnglishCard(
                phonetic.name
            );


        if(searchCancelled){

            return;

        }


        if(englishCard){

            showCard(
                englishCard,
                englishCard.name,
                "Phonetic Match"
            );


            isSearching = false;

            stopButton.disabled = true;

            return;

        }

    }


    if(!searchCancelled){

        result.textContent =
            "Heard: " +
            lastHeardText +
            "\nCard not found.";


        isSearching = false;

        stopButton.disabled = true;

    }

}


/* =========================================================
   SHOW CARD
========================================================= */

function showCard(
    data,
    matchedName,
    method
){

    if(searchCancelled){

        return;

    }


    if(data.lang !== "en"){

        console.error(
            "Non-English card rejected:",
            data.lang,
            data.name
        );

        return;

    }


    let imageURL = null;


    if(
        data.image_uris &&
        data.image_uris.normal
    ){

        imageURL =
            data.image_uris.normal;

    }
    else if(
        data.card_faces &&
        data.card_faces[0] &&
        data.card_faces[0].image_uris
    ){

        imageURL =
            data.card_faces[0]
            .image_uris
            .normal;

    }


    if(!imageURL){

        result.textContent =
            "Card found, but no image is available.";

        return;

    }


    fullscreenCard.src =
        imageURL;


    cardView.style.display =
        "flex";


    document.body.classList.add(
        "cardMode"
    );

}


/* =========================================================
   CLOSE CARD VIEW
========================================================= */

function closeCardView(){

    cardView.style.display =
        "none";


    document.body.classList.remove(
        "cardMode"
    );


    fullscreenCard.removeAttribute(
        "src"
    );

}

/* =========================================================
   KEYWORD CATALOG
========================================================= */

async function getKeywordCatalog(
    catalogName
){

    try{

        const response =
            await fetch(
                "https://api.scryfall.com/catalog/" +
                catalogName
            );


        if(!response.ok){

            return null;

        }


        const data =
            await response.json();


        return data.data || null;

    }
    catch(error){

        console.error(error);

        return null;

    }

}


/* =========================================================
   FIND KEYWORD TYPE
========================================================= */

async function findKeywordType(
    keyword
){

    const normalized =
        normalizeText(keyword);


    if(!normalized){

        return null;

    }


    if(!keywordAbilitiesCache){

        keywordAbilitiesCache =
            await getKeywordCatalog(
                "keyword-abilities"
            );

    }


    if(!keywordActionsCache){

        keywordActionsCache =
            await getKeywordCatalog(
                "keyword-actions"
            );

    }


    if(!abilityWordsCache){

        abilityWordsCache =
            await getKeywordCatalog(
                "ability-words"
            );

    }


    function matches(list){

        if(!list){

            return false;

        }


        return list.some(
            function(item){

                return normalizeText(item) ===
                    normalized;

            }
        );

    }


    if(matches(keywordAbilitiesCache)){

        return "Keyword Ability";

    }


    if(matches(keywordActionsCache)){

        return "Keyword Action";

    }


    if(matches(abilityWordsCache)){

        return "Ability Word";

    }


    return null;

}

/* =========================================================
   ABILITY WORD EXPLANATION
========================================================= */

function getAbilityWordDefinition(
    keyword
){

    const normalized =
        normalizeText(keyword);


    if(
        abilityWordDefinitions[
            normalized
        ]
    ){

        return abilityWordDefinitions[
            normalized
        ];

    }


    return (
        "An ability word used to group abilities " +
        "that share a particular theme or condition. " +
        "Ability words have no rules meaning by themselves; " +
        "the actual effect is defined by the ability that follows the word."
    );

}


/* =========================================================
   EXTRACT REMINDER TEXT
========================================================= */

function extractReminderText(
    oracleText,
    keyword
){

    if(!oracleText){

        return null;

    }


    const lines =
        oracleText.split("\n");


    const normalizedKeyword =
        normalizeText(keyword);


    for(
        let i=0;
        i<lines.length;
        i++
    ){

        const line =
            lines[i];


        const normalizedLine =
            normalizeText(line);


        if(
            normalizedLine.includes(
                normalizedKeyword
            )
        ){

            const match =
                line.match(
                    /\(([^()]*)\)/
                );


            if(match){

                return match[1].trim();

            }

        }

    }


    return null;

}


/* =========================================================
   GET KEYWORD DESCRIPTION
========================================================= */

async function getKeywordDescription(
    keyword,
    keywordType
){

    if(searchCancelled){

        return null;

    }


    if(
        keywordType ===
        "Ability Word"
    ){

        return {

            description:
                getAbilityWordDefinition(
                    keyword
                ),

            sourceCard:null

        };

    }


    const query =
        "keyword:" +
        keyword +
        " lang:en";


    try{

        const response =
            await fetch(
                "https://api.scryfall.com/cards/search?q=" +
                encodeURIComponent(query) +
                "&unique=cards"
            );


        if(searchCancelled){

            return null;

        }


        if(!response.ok){

            return null;

        }


        const data =
            await response.json();


        if(
            !data.data ||
            !data.data.length
        ){

            return null;

        }


        for(
            const card of data.data
        ){

            if(searchCancelled){

                return null;

            }


            if(card.lang !== "en"){

                continue;

            }


            const description =
                extractReminderText(
                    card.oracle_text,
                    keyword
                );


            if(description){

                return {

                    description:description,

                    sourceCard:card.name

                };

            }

        }

    }
    catch(error){

        console.error(error);

    }


    return null;

}

async function searchKeyword(){

    const keyword =
        keywordInput.value.trim();


    if(!keyword){

        return;

    }


    keywordInput.value = "";


    closeCardView();


    searchCancelled = true;

    isSearching = false;


    try{

        if(recognition){

            recognition.abort();

        }

    }
    catch(e){}


    stopButton.disabled = true;


    keywordTitle.textContent =
        "";


    keywordDescription.textContent =
        "Searching...";


    searchCancelled = false;


    const keywordType =
        await findKeywordType(
            keyword
        );


    if(searchCancelled){

        return;

    }


    if(!keywordType){

        keywordTitle.textContent =
            keyword;


        keywordDescription.textContent =
            "Keyword not found.";


        keywordResult.scrollIntoView({

            behavior:"smooth",

            block:"start"

        });


        return;

    }


    keywordTitle.textContent =
        keyword +
        " — " +
        keywordType;


    const information =
        await getKeywordDescription(
            keyword,
            keywordType
        );


    if(searchCancelled){

        return;

    }


    if(information){

        keywordDescription.textContent =
            information.description;

    }
    else{

        keywordDescription.textContent =
            "No English explanation was found.";

    }


    keywordResult.scrollIntoView({

        behavior:"smooth",

        block:"start"

    });

}
