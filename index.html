<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTG Voice Card</title>

    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        button {
            font-size: 24px;
            padding: 20px 30px;
            border-radius: 15px;
            border: none;
            background: white;
            color: black;
        }

        button:disabled {
            opacity: 0.5;
        }

        #result {
            margin-top: 30px;
            font-size: 22px;
            max-width: 90%;
        }

        #card {
            display: none;
            max-width: 90%;
            max-height: 65vh;
            margin-top: 25px;
            border-radius: 12px;
        }
    </style>
</head>

<body>

    <button id="listenButton">🎤 Speak card name</button>

    <div id="result">
        Tap the button and say a Magic card name.
    </div>

    <img id="card" alt="Magic card">

<script>

const button = document.getElementById("listenButton");
const result = document.getElementById("result");
const cardImage = document.getElementById("card");

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

if (!SpeechRecognition) {

    result.textContent =
        "Speech recognition is not supported.";

} else {

    const recognition = new SpeechRecognition();

    recognition.lang = "en-US";
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    let timeout;

    button.addEventListener("click", () => {

        clearTimeout(timeout);

        result.textContent = "🎤 Listening...";
        cardImage.style.display = "none";
        button.disabled = true;

        try {
            recognition.start();
        } catch (e) {
            console.log(e);
        }

        timeout = setTimeout(() => {
            recognition.stop();
        }, 7000);

    });

    recognition.onresult = async (event) => {

        clearTimeout(timeout);

        const spokenText =
            event.results[0][0].transcript.trim();

        result.textContent =
            "Searching for: " + spokenText;

        recognition.stop();

        await findCard(spokenText);
    };

    recognition.onerror = (event) => {

        clearTimeout(timeout);

        result.textContent =
            "Speech error: " + event.error;

        button.disabled = false;
    };

    recognition.onend = () => {

        clearTimeout(timeout);

        button.disabled = false;
    };
}


/*
    Search Scryfall for the spoken card name
*/

async function findCard(cardName) {

    try {

        const url =
            "https://api.scryfall.com/cards/named?exact=" +
            encodeURIComponent(cardName);

        const response = await fetch(url);

        if (!response.ok) {

            result.textContent =
                "Card not found: " + cardName;

            return;
        }

        const data = await response.json();

        result.textContent =
            data.name;

        if (data.image_uris && data.image_uris.normal) {

            cardImage.src = data.image_uris.normal;
            cardImage.style.display = "block";

        } else {

            result.textContent =
                "Card found, but no image is available.";

        }

    } catch (error) {

        console.error(error);

        result.textContent =
            "Could not connect to Scryfall.";

    }
}

</script>

</body>
</html>
